<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LLM Chat</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- Login overlay -->
<div id="login-overlay">
  <div class="login-box">
    <h1>🔒 LLM Chat</h1>
    <input id="login-username" type="text" placeholder="Username" autocomplete="username" />
    <input id="login-password" type="password" placeholder="Password" autocomplete="current-password" />
    <button id="login-btn">Sign In</button>
    <div id="login-error"></div>
  </div>
</div>

<!-- Main app -->
<div id="app">
  <aside id="sidebar">
    <div id="sidebar-header">
      <span>Conversations</span>
      <button id="new-chat-btn">+ New</button>
    </div>
    <div id="conv-list"></div>
    <div id="sidebar-footer">
      <span id="user-label"></span>
      <button id="logout-btn">Logout</button>
    </div>
  </aside>

  <div id="main">
    <div id="toolbar">
      <label for="model-select">Model:</label>
      <select id="model-select"><option value="">Default</option></select>
      <input type="checkbox" id="rag-toggle" checked />
      <label for="rag-toggle" id="rag-label">Use document context (RAG)</label>
    </div>

    <div id="chat-area">
      <div id="empty-state">Select a conversation or start a new chat.</div>
    </div>

    <div id="input-bar">
      <textarea id="msg-input" placeholder="Type a message… (Enter to send, Shift+Enter for newline)" rows="1"></textarea>
      <button id="send-btn" disabled>Send</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
